# アナログ計器信号（温度・圧力・流量）の模擬
# 正弦波・三角波・矩形波およびランダムノイズを組み合わせた値変化
#
# - D100: 温度センサ（20〜80℃）: 正弦波に微小なランダムノイズを付加
# - D101: 圧力センサ（0〜500 kPa）: 10秒周期の三角波による加減圧サイクル
# - D102: 流量センサ（0 / 150 L/min）: 8秒周期の矩形波（バルブ開閉による流量変化）
- type: periodic
  interval_ms: 500
  actions:
    - target: D100
      expr: "int(clamp(50 + 25 * sin(t * 0.2) + randint(-1, 1), 0, 100))"
    - target: D101
      expr: "int(500 * triangle(t, 10.0))"
    - target: D102
      expr: "int(150 * square(t, 8.0))"
